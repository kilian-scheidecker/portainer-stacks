services:
  # PostgrSQL database for authentik
  postgresql:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_PASSWORD: ${PG_PASS}
      POSTGRES_USER: authentik
    volumes:
    - database:/var/lib/postgresql/data
    healthcheck:
      interval: 30s
      retries: 5
      start_period: 20s
      test:
      - CMD-SHELL
      - pg_isready -d authentik -U authentik
      timeout: 5s
    networks:
      - hephaistos

  # Authentik server
  server:
    image: ghcr.io/goauthentik/server:2025.12.6
    restart: unless-stopped
    command: server
    ports:
      - 9001:9000
      - 9002:9443
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
    volumes:
    - authentik_media:/media
    - authentik_templates:/templates
    networks:
      - hephaistos
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.authentik.rule=Host(`apps.petits-bouts.com`) || Host(`auth.petits-bouts.com`) || Host(`auth.nova-defence.com`)"
      - "traefik.http.routers.authentik.entrypoints=websecure"
      - "traefik.http.services.authentik.loadbalancer.server.port=9000"
    depends_on:
      postgresql:
        condition: service_healthy

  # Authentik worker
  worker:
    image: ghcr.io/goauthentik/server:2025.12.6
    restart: unless-stopped
    user: root
    command: worker
    environment:
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS}
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - authentik_media:/media
      - authentik_certs:/certs
      - authentik_templates:/templates
    networks:
      - hephaistos
    depends_on:
      postgresql:
        condition: service_healthy

  # LDAP outpost - exposes Authentik as an LDAP server for apps like Jellyfin
  ldap-outpost:
    image: ghcr.io/goauthentik/ldap:2025.12.6
    restart: unless-stopped
    environment:
      AUTHENTIK_HOST: http://server:9000
      AUTHENTIK_INSECURE: "true"
      AUTHENTIK_TOKEN: ${AUTHENTIK_LDAP_OUTPOST_TOKEN}
    networks:
      - hephaistos
    depends_on:
      - server

networks:
  hephaistos:
    external: true

volumes:
  authentik_media:
  authentik_certs:
  authentik_templates:
  database:
    driver: local

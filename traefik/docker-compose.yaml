services:
  traefik:
    image: "traefik:v2.0.0-rc3"
    container_name: "traefik"
    command:
      #- "--log.level=DEBUG"
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"     # ingress
      - "81:8080"   # ui
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - hephaistos

networks:
  hephaistos:
    external: true
